name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript — build + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the highest floor any package declares (@bkey/cli, via
        # commander 15); 24 is the current active LTS. Running both means a
        # green CI proves the declared floor is real AND that current LTS
        # works. Node 20 went EOL 2026-04-30 and is deliberately not tested.
        node-version: [22, 24]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Asserts every published package declares engines.node, that each
      # declared range is a subset of every dependency's own engines, and that
      # this job's Node satisfies all of them. Without it, the next dependabot
      # bump can raise the real floor again with nothing going red.
      - run: node scripts/check-engines.mjs
      - run: pnpm build
      - run: pnpm test
      # Typechecks the test sources that each package's build tsconfig
      # excludes from dist/. Without this they are compiled by nothing:
      # `vitest run` executes tests without typechecking them, and its
      # `typecheck.include` default (`*.test-d.*`) applies only under
      # `--typecheck`, which no package here passes — so a `*.test-d.ts` type
      # test is no more typechecked than a `*.test.ts`. Runs
      # `tsc -p tsconfig.test.json` (`noEmit`) per package;
      # `check-pack-contents.mjs` below asserts every package with test sources
      # actually has that config and a script that passes it to `tsc -p`,
      # because `turbo run typecheck` reports a package that has neither as a
      # success.
      - run: pnpm typecheck
      # Unit tests for the tarball matcher itself, over the exact paths a
      # review found the previous version of this gate getting wrong. Node's
      # built-in runner: no tool to install, and nothing to pin in a `run:`
      # step where dependabot cannot see it.
      - run: pnpm test:scripts
      # Asserts, for every published package: its tarball contains no test
      # module (a `test`/`tests`/`__test__`/`__tests__`/`__mocks__` directory
      # at any depth, a code file under `spec`/`specs`, or a
      # `.test.`/`.spec.`/`.test-d.`/`.spec-d.` JS/TS/map/declaration basename,
      # all case-insensitively — see scripts/lib/pack-contents.mjs for what it
      # does not cover); the tarball does contain every file the manifest
      # points at plus at least one JS module, so an unbuilt dist/ cannot score
      # as clean; and its test sources are still typechecked.
      # `@bkey/sdk` shipped `dist/client.test.js` to npm because its tsconfig
      # was missing the `exclude` its siblings had, and nothing went red.
      # Runs after the build so it inspects real output.
      - run: node scripts/check-pack-contents.mjs

  python:
    name: Python — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff/pytest come from the pinned `ci` dependency-group in
      # python/pyproject.toml, resolved through uv.lock. They are NOT `--with`
      # specs: a version inside a `run:` string is invisible to Dependabot, so it
      # would silently rot. `--locked` fails if pyproject.toml and uv.lock drift.
      - run: uv run --locked --group ci ruff check bkey/
      - run: uv run --locked --group ci pytest tests/ -v

  yaml-lint:
    name: YAML — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "docs/ .github/ typescript/pnpm-workspace.yaml"
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy:
                check-keys: false
              document-start: disable

  docs-lint:
    name: Docs — markdown + MDX lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint markdown and MDX
        run: |
          cat > /tmp/.markdownlint.json << 'MLCFG'
          {
            "MD013": false,
            "MD024": false,
            "MD025": false,
            "MD031": false,
            "MD032": false,
            "MD033": false,
            "MD040": false,
            "MD041": false,
            "MD060": false
          }
          MLCFG
          npx markdownlint-cli@0.49.1 "**/*.md" \
            --ignore "**/node_modules/**" \
            --ignore "**/target/**" \
            --ignore "**/.pytest_cache/**" \
            --ignore "**/dist/**" \
            --ignore "**/build/**" \
            --config /tmp/.markdownlint.json
      - name: Validate Mintlify docs.json
        run: node -e "JSON.parse(require('fs').readFileSync('docs/docs.json','utf8')); console.log('docs.json valid')"
      - name: Check frontmatter in MDX files
        run: |
          for f in docs/**/*.mdx; do
            if ! head -1 "$f" | grep -q '^---'; then
              echo "Missing frontmatter: $f"
              exit 1
            fi
          done
          echo "All MDX files have frontmatter"
      - name: Mintlify build validation
        working-directory: docs
        run: npx --yes mint@4.2.783 validate
      - name: Mintlify broken-links check
        working-directory: docs
        run: |
          output=$(npx --yes mint@4.2.783 broken-links 2>&1)
          echo "$output"
          if echo "$output" | grep -q "found .* broken link"; then
            echo "::error::Mintlify detected broken links. Fix them or update docs.json."
            exit 1
          fi
