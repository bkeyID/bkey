name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-sdk:
    name: Publish @bkey/sdk to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Tag version must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG"
          tag_version="${tag#sdk-v}"
          pkg_version=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag implies version $tag_version but packages/sdk/package.json is $pkg_version" >&2
            exit 1
          fi
          echo "@bkey/sdk $pkg_version matches tag $tag"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @bkey/sdk test
      - run: pnpm --filter @bkey/sdk publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

