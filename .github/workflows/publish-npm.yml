name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-sdk:
    name: Publish @bkey/sdk to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Tag version must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG"
          tag_version="${tag#sdk-v}"
          pkg_version=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag implies version $tag_version but packages/sdk/package.json is $pkg_version" >&2
            exit 1
          fi
          echo "@bkey/sdk $pkg_version matches tag $tag"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @bkey/sdk test
      - run: pnpm --filter @bkey/sdk publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm 9 does not forward --provenance to npm; the env var does reach
          # it. Both are set so whichever the pnpm version honours wins.
          NPM_CONFIG_PROVENANCE: "true"
      - name: Verify provenance attestation attached
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          url="https://registry.npmjs.org/-/npm/v1/attestations/@bkey%2fsdk@$version"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] && { echo "provenance attestation present for @bkey/sdk@$version"; exit 0; }
            echo "attempt $i: attestation not visible yet (HTTP $code)"
            sleep 10
          done
          echo "::error::@bkey/sdk@$version published WITHOUT a provenance attestation" >&2
          exit 1

