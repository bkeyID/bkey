<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bkey CAPTCHA live test</title>
<style>body{font:16px system-ui;max-width:560px;margin:60px auto;padding:20px}label{display:block;margin:20px 0}input{display:block;width:100%;padding:10px;box-sizing:border-box}button{padding:10px 18px}#widget{margin:30px 0}p{line-height:1.5}</style>
<h1>Test Bkey verification</h1><p>Use a human-check sitekey that allows this page's hostname. Approval requires the Bkey app and an enabled backend.</p>
<form id="settings"><label>API origin<input id="api" type="url" value="https://api.bkey.id" required></label><label>Public sitekey<input id="sitekey" required autocomplete="off"></label><button>Load verification</button></form><div id="widget"></div><p id="status" role="status"></p>
<script type="module">
import * as bkey from '/dist/index.js';
let widget;
const status=document.querySelector('#status');
document.querySelector('#settings').addEventListener('submit',event=>{
 event.preventDefault();
 if(widget){bkey.remove(widget);widget=undefined;}
 try {
  bkey.configure({apiUrl:document.querySelector('#api').value});
  widget=bkey.render('#widget',{sitekey:document.querySelector('#sitekey').value,callback:()=>{status.textContent='Phone approval received. Your server must still verify the result before granting access.';},'error-callback':()=>{status.textContent='Verification failed. Check the API configuration and sitekey hostname.';},'expired-callback':()=>{status.textContent='Request expired. Start again.';}});
  status.textContent='Ready for verification.';
 }catch(error){status.textContent=error.message;}
});
</script></html>
